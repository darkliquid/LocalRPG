# Configuration for scripts/project.sh and the `mise run project:*` tasks.
#
# The project is long-lived: it is identified by PROJECT_ID alone, so its name
# can change and its waves, areas, epics, and proposals can keep growing. The
# script resolves the project, its fields, and their option IDs by name at run
# time, so no numeric IDs live in the script.
#
# To start a fresh project instead, run `mise run project:new --title "..."`;
# it creates the project and its fields and writes the new PROJECT_ID here.

OWNER="darkliquid"
REPO="darkliquid/LocalRPG"
PROJECT_ID="PVT_kwHNehjOAZcjFA"

# The document this phase's proposals come from, linked from each issue.
REFERENCE="docs/proposals/2026-10-05-next-phase-deep-dive.md"

# Statuses, in workflow order. The first is where a new item starts. These are
# convention, not per-phase, so they live here rather than in the project.
STATUSES=(Proposal Specced Planned 'In Progress' Testing Done)

# Kinds, each mapped to a label. `enhancement` and `documentation` reuse the
# built-in GitHub labels; the rest are `type/<kind>`.
KINDS=(epic feature enhancement refactor chore test research documentation)

# Effort labels.
EFFORTS=(S M L)

# Definition-of-done boxes, as "<key>|<line prefix in the issue body>|<suffix>".
# The key is what `mise run project:check <issue> <key>` takes.
DOD=(
  'spec|Spec written| (`docs/superpowers/specs/`)'
  'plan|Plan written| (`docs/superpowers/plans/`)'
  'implemented|Implemented|'
  'tested|`mise run test`| and `mise run lint` pass'
  'docs|User-facing docs updated| (if applicable)'
)
