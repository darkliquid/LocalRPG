[tools]
go = "1.27.1"
node = "26.9.0"

[tasks."install:frontend"]
description = "Install frontend dependencies when package manifests change"
dir = "frontend"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.setup]
description = "Install dependencies for Go backend and frontend"
depends = ["install:frontend"]
run = "go mod download"

[tasks."build:frontend"]
description = "Build the React 19 frontend bundle into pkg/gui/dist"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run build && touch ../pkg/gui/dist/.gitkeep && (cp -r ../pkg/gui/dist ./dist 2>/dev/null || true)"
sources = ["src/**/*", "index.html", "package.json"]
outputs = ["../pkg/gui/dist/index.html"]

[tasks."build:backend"]
description = "Build the localrpg CLI binary"
depends = ["build:frontend"]
run = "go build -o bin/localrpg ./cmd/localrpg"
sources = ["cmd/**/*", "pkg/**/*", "go.mod"]
outputs = ["bin/localrpg"]

[tasks.build]
description = "Build all project artifacts (frontend + backend binary)"
depends = ["build:backend"]

[tasks."test:backend"]
description = "Run all Go unit and integration tests"
run = "go test -v -count=1 ./..."

[tasks."test:frontend"]
description = "Run TypeScript type checks on frontend"
dir = "frontend"
depends = ["install:frontend"]
run = "npx tsc --noEmit"

[tasks.test]
description = "Run all tests across the project"
depends = ["test:backend", "test:frontend"]

[tasks."lint:docs"]
description = "Lint the embedded documentation Markdown"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run lint:docs"

[tasks.lint]
description = "Run code analysis and linting"
depends = ["lint:docs"]
run = "go vet ./..."

[tasks."dev:gui"]
description = "Launch GUI in development mode"
run = "go run ./cmd/localrpg gui --port 8080"

[tasks."dev:frontend"]
description = "Launch Vite frontend dev server with hot reload"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run dev"

[tasks.clean]
description = "Clean up build outputs"
run = "rm -rf bin/ dist/ frontend/dist"
