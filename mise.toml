[tools]
go = "1.27.1"
node = "26.9.0"
goreleaser = "2.18.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
vale = "3.24.0"

[tasks."install:frontend"]
description = "Install frontend dependencies when package manifests change"
dir = "frontend"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."install:vale-styles"]
description = "Download the Vale style packages when .vale.ini changes"
run = "vale sync"
sources = [".vale.ini"]
# Not "styles": the committed vocabulary lives under styles/config, so styles/
# exists in a fresh clone and mise would treat the download as already done.
outputs = ["styles/Google"]

[tasks.setup]
description = "Install dependencies for Go backend and frontend"
depends = ["install:frontend"]
run = "go mod download"

[tasks."build:frontend"]
description = "Build the React 19 frontend bundle into pkg/gui/dist"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run build && touch ../pkg/gui/dist/.gitkeep && (cp -r ../pkg/gui/dist ./dist 2>/dev/null || true)"
sources = ["src/**/*", "index.html", "player.html", "vite.player.config.ts", "package.json"]
outputs = ["../pkg/gui/dist/index.html", "../pkg/gui/dist/player/player.html"]

[tasks."build:backend"]
description = "Build the localrpg CLI binary"
depends = ["build:frontend"]
run = "go build -o bin/localrpg ./cmd/localrpg"
sources = ["cmd/**/*", "pkg/**/*", "go.mod"]
outputs = ["bin/localrpg"]

[tasks.build]
description = "Build all project artifacts (frontend + backend binary)"
depends = ["build:backend"]

[tasks."test:backend"]
description = "Run all Go unit and integration tests"
run = "go test -v -count=1 ./..."

[tasks."test:e2e"]
description = "Run the end-to-end browser suite (skips without a browser)"
run = "go test -v -count=1 -tags e2e ./pkg/e2e/..."

[tasks."test:frontend"]
description = "Run TypeScript type checks and the frontend test suite"
dir = "frontend"
depends = ["build:frontend"]
run = """
npx tsc --noEmit
npx vitest run
"""

[tasks.test]
description = "Run all tests across the project"
depends = ["test:backend", "test:frontend", "test:e2e"]

[tasks."lint:docs"]
description = "Lint the embedded documentation Markdown"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run lint:docs"

[tasks."lint:prose"]
description = "Run Vale over tracked prose and source comments (report only; STRICT=1 to gate)"
depends = ["install:vale-styles"]
run = "bash scripts/lint-prose.sh"

[tasks.lint]
description = "Run code analysis and linting"
depends = ["lint:docs", "lint:goreleaser", "lint:actions"]
run = """
go vet ./...
go vet -tags e2e ./pkg/e2e/...
"""

[tasks."dev:gui"]
description = "Launch GUI in development mode"
run = "go run ./cmd/localrpg gui --port 8080"

[tasks."dev:frontend"]
description = "Launch Vite frontend dev server with hot reload"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run dev"

[tasks."lint:goreleaser"]
description = "Validate the GoReleaser release configuration"
run = "goreleaser check"

[tasks."lint:actions"]
description = "Validate the GitHub Actions workflow files"
run = "actionlint"

[tasks."secrets:scan"]
description = "Scan the full git history and staged changes for secrets"
run = [
  "gitleaks git . --log-opts=\"--all\" --redact --no-banner",
  "gitleaks git . --staged --redact --no-banner",
]

[tasks."site:build"]
description = "Build the static showcase site into website/dist"
run = "go run ./tools/sitegen"

[tasks."site:serve"]
description = "Build the showcase site and serve it at http://localhost:4173"
run = "go run ./tools/sitegen -serve"

[tasks."site:screenshots"]
description = "Capture showcase screenshots from the running GUI into website/screenshots"
depends = ["build:backend"]
run = "bash website/capture-screenshots.sh"

[tasks."release:snapshot"]
description = "Build a local snapshot release for the current operating system"
run = "RELEASE_TARGET=\"$(go env GOOS)/$(go env GOARCH)\" goreleaser release --snapshot --clean"

[tasks."release:package"]
description = "Build and package release archives for RELEASE_TARGET (one platform)"
run = "goreleaser release --clean --skip=publish --skip=validate"

[tasks."release:cut"]
description = "Cut a release: bump or set the version, commit, tag and push with tags"
usage = 'arg "<bump>" help="major, minor, patch, or an explicit X.Y.Z version" default="patch"'
run = "bash scripts/cut-release.sh \"${usage_bump:-patch}\""

[tasks.clean]
description = "Clean up build outputs"
run = "rm -rf bin/ dist/ frontend/dist website/dist"

# --- project and issue tracking ---------------------------------------------
# These wrap scripts/project.sh, which owns the GitHub Project field IDs and the
# status vocabulary, so the tasks stay declarative. They are how a worker finds
# its next task and records progress. See AGENTS.md, "Working the project".

[tasks."project:list"]
description = "List project items, optionally filtered"
usage = '''
flag "--status <status>" help="proposal, specced, planned, in-progress, testing, or done"
flag "--wave <wave>" help="1, 2, 3, or 4"
flag "--area <area>" help="providers, systems, media, ..."
flag "--kind <kind>" help="epic, feature, enhancement, refactor, chore, test, research, documentation"
'''
run = 'bash scripts/project.sh list --status "${usage_status:-}" --wave "${usage_wave:-}" --area "${usage_area:-}" --kind "${usage_kind:-}"'

[tasks."project:show"]
description = "Show one project item in full: status, fields, spec, plan, and DoD"
usage = 'arg "<issue>" help="the issue number"'
run = 'bash scripts/project.sh show "${usage_issue}"'

[tasks."project:next"]
description = "Print the next ready work item (earliest wave, In Progress first)"
usage = 'flag "--wave <wave>" help="restrict to a wave (1-4)"'
run = 'bash scripts/project.sh next "${usage_wave:-}"'

[tasks."project:status"]
description = "Set a project item's status"
usage = '''
arg "<issue>" help="the issue number"
arg "<status>" help="proposal, specced, planned, in-progress, testing, or done"
'''
run = 'bash scripts/project.sh status "${usage_issue}" "${usage_status}"'

[tasks."project:check"]
description = "Tick a definition-of-done box on an issue"
usage = '''
arg "<issue>" help="the issue number"
arg "<box>" help="spec, plan, implemented, tested, or docs"
flag "--uncheck" help="clear the box instead"
'''
run = 'bash scripts/project.sh check "${usage_issue}" "${usage_box}" ${usage_uncheck:+--uncheck}'

[tasks."project:scaffold"]
description = "Create the spec and plan skeletons for an issue"
usage = '''
arg "<issue>" help="the issue number"
flag "--slug <slug>" help="override the derived file slug"
'''
run = 'bash scripts/project.sh scaffold "${usage_issue}" ${usage_slug:+--slug "$usage_slug"}'

[tasks."project:add-wave"]
description = "Add a wave: its milestone, project field option, and label"
usage = '''
arg "<number>" help="the wave number"
arg "<title>" help="the wave title"
'''
run = 'bash scripts/project.sh add-wave "${usage_number}" "${usage_title}"'

[tasks."project:add-area"]
description = "Add a theme area: its label and project field option"
usage = 'arg "<slug>" help="the area slug, e.g. audio"'
run = 'bash scripts/project.sh add-area "${usage_slug}"'

[tasks."project:new"]
description = "Create a fresh GitHub Project with the standard fields, and write its ID to project.conf"
usage = 'flag "--title <title>" help="the project title"'
run = 'bash scripts/project.sh new --title "$usage_title"'

[tasks."project:add-epic"]
description = "Create an epic issue, add it to the project, and set its fields"
usage = '''
flag "--area <area>" help="the area label suffix"
flag "--title <title>" help="the epic title"
flag "--wave <wave>" help="1, 2, 3, or 4"
flag "--summary <summary>" help="a one-line summary"
'''
run = 'bash scripts/project.sh add-epic --area "$usage_area" --title "$usage_title" --wave "$usage_wave" --summary "$usage_summary"'

[tasks."project:add-proposal"]
description = "Create a proposal issue under an epic and wire it up"
usage = '''
flag "--epic <epic>" help="the parent epic issue number"
flag "--id <id>" help="the proposal id, e.g. RB-7"
flag "--title <title>" help="the proposal title"
flag "--area <area>" help="the area label suffix"
flag "--wave <wave>" help="1, 2, 3, or 4"
flag "--effort <effort>" help="S, M, or L"
flag "--kind <kind>" help="feature, enhancement, refactor, chore, test, research, documentation"
flag "--summary <summary>" help="a one-line summary"
flag "--deps <deps>" help="comma-separated dependencies"
'''
run = 'bash scripts/project.sh add-proposal --epic "$usage_epic" --id "$usage_id" --title "$usage_title" --area "$usage_area" --wave "$usage_wave" --effort "$usage_effort" --kind "$usage_kind" --summary "$usage_summary" --deps "${usage_deps:-none}"'

[tasks."project:link"]
description = "Attach an existing issue as a sub-issue of an epic"
usage = '''
arg "<epic>" help="the parent epic issue number"
arg "<issue>" help="the child issue number"
'''
run = 'bash scripts/project.sh link "${usage_epic}" "${usage_issue}"'
