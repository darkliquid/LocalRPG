[tools]
go = "1.27.1"
node = "26.9.0"
goreleaser = "2.18.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
vale = "3.24.0"
rumdl = "0.2.78"
staticcheck = "2026.2.1"
revive = "1.15.0"

[tasks."install:frontend"]
description = "Install frontend dependencies when package manifests change"
dir = "frontend"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."install:vale-styles"]
description = "Download the Vale style packages when .vale.ini changes"
run = "vale sync"
sources = [".vale.ini"]
# Not "styles": the committed vocabulary lives under styles/config, so styles/
# exists in a fresh clone and mise would treat the download as already done.
outputs = ["styles/Google"]

[tasks.setup]
description = "Install dependencies for Go backend and frontend"
depends = ["install:frontend"]
run = "go mod download"

[tasks."build:frontend"]
description = "Build the React 19 frontend bundle into pkg/gui/dist"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run build && touch ../pkg/gui/dist/.gitkeep && (cp -r ../pkg/gui/dist ./dist 2>/dev/null || true)"
sources = ["src/**/*", "index.html", "player.html", "vite.player.config.ts", "package.json"]
outputs = ["../pkg/gui/dist/index.html", "../pkg/gui/dist/player/player.html"]

[tasks."build:backend"]
description = "Build the localrpg CLI binary"
depends = ["build:frontend"]
run = "go build -o bin/localrpg ./cmd/localrpg"
sources = ["cmd/**/*", "pkg/**/*", "go.mod"]
outputs = ["bin/localrpg"]

[tasks.build]
description = "Build all project artifacts (frontend + backend binary)"
depends = ["build:backend"]

[tasks."test:backend"]
description = "Run all Go unit and integration tests, and check statement coverage"
run = "bash scripts/check-coverage.sh"

[tasks."test:backend:fast"]
description = "Run the Go tests without the coverage check"
run = "go test -v -count=1 -shuffle=on ./..."

[tasks."test:backend:race"]
description = "Run the Go tests with the race detector enabled"
run = "go test -race -shuffle=on ./..."

[tasks."coverage:diff"]
description = "Compare two coverage profiles by function, not by their statement totals"
# The statement totals move with layout: a block's statement count is repeated once
# per code range the block produces, and a comment splits a block into another
# range. What does not move is which functions were fully covered, so that is what
# is compared. See the script for the full reasoning.
run = "bash scripts/coverage-diff.sh"

[tasks."test:e2e"]
description = "Run the end-to-end browser suite (skips without a browser)"
run = "go test -v -count=1 -tags e2e ./pkg/e2e/..."

[tasks."test:frontend"]
description = "Run TypeScript type checks and the frontend test suite, with coverage floors"
dir = "frontend"
depends = ["build:frontend"]
run = """
npx tsc --noEmit
npx vitest run --coverage
"""

[tasks."test:fuzz"]
description = "Run the fuzz targets for a longer budget"
run = """
go test ./pkg/turnstream/ -run FuzzParser -fuzz FuzzParser -fuzztime 60s
go test ./pkg/jsonrepair/ -run FuzzRepair -fuzz FuzzRepair -fuzztime 60s
"""

[tasks.test]
description = "Run all tests across the project"
depends = ["test:backend", "test:frontend", "test:e2e"]

[tasks."lint:docs"]
description = "Lint the embedded documentation Markdown with rumdl"
run = "rumdl check pkg/gui/docs"

[tasks."lint:gofmt"]
description = "Fail if any Go file is not gofmt-formatted"
# `gofmt -l` prints the offending files and exits 0 either way, so the list is
# captured and the exit status comes from whether it is empty. Printing it in the
# failing case is what tells a contributor which files to fix.
run = """
files="$(gofmt -l cmd pkg tools)"
if [ -n "$files" ]; then
  printf 'gofmt: these files are not formatted (run `gofmt -w` on them):\\n%s\\n' "$files"
  exit 1
fi
"""

[tasks."lint:staticcheck"]
description = "Run staticcheck over the Go packages"
# The default check set (all, not just the style checks), because the U1000
# unused-code findings are what caught the scene worker's guardrails being wired
# to nothing. It analyses test files too.
run = "staticcheck ./..."

[tasks."lint:frontend"]
description = "Check the frontend's formatting and run ESLint over it"
dir = "frontend"
depends = ["install:frontend"]
# Prettier first: it is fast, and a formatting failure makes the lint findings
# harder to read. ESLint's error level is what gates; its warnings are the
# tracked accessibility and React Compiler work, and they print here.
run = """
npm run format:check
npm run lint
"""

[tasks."lint:prose"]
description = "Run Vale over tracked prose and source comments (report only; STRICT=1 to gate)"
depends = ["install:vale-styles"]
run = "bash scripts/lint-prose.sh"

[tasks."lint:revive"]
description = "Report undocumented exported symbols with revive (report only; STRICT=1 to gate)"
# revive exits non-zero as soon as it finds anything, so its status is captured
# rather than passed through: the list is a report while the middle layers are
# still undocumented, and STRICT=1 is what turns it into a gate. The rules and
# the reason for each are in revive.toml.
run = """
findings="$(revive -config revive.toml ./... 2>&1 || true)"
if [ -n "$findings" ]; then
  printf '%s\\n' "$findings"
  printf 'revive: %s findings\\n' "$(printf '%s\\n' "$findings" | grep -c ':')"
fi
if [ "${STRICT:-0}" = "1" ] && [ -n "$findings" ]; then
  exit 1
fi
"""

[tasks.lint]
description = "Run code analysis and linting"
depends = ["lint:docs", "lint:gofmt", "lint:staticcheck", "lint:frontend", "lint:goreleaser", "lint:actions"]
run = """
go vet ./...
go vet -tags e2e ./pkg/e2e/...
STRICT=1 mise run lint:revive
"""

[tasks."dev:gui"]
description = "Launch GUI in development mode"
run = "go run ./cmd/localrpg gui --port 8080"

[tasks."dev:frontend"]
description = "Launch Vite frontend dev server with hot reload"
dir = "frontend"
depends = ["install:frontend"]
run = "npm run dev"

[tasks."lint:goreleaser"]
description = "Validate the GoReleaser release configuration"
run = "goreleaser check"

[tasks."lint:actions"]
description = "Validate the GitHub Actions workflow files"
run = "actionlint"

[tasks."secrets:scan"]
description = "Scan the full git history and staged changes for secrets"
run = [
  "gitleaks git . --log-opts=\"--all\" --redact --no-banner",
  "gitleaks git . --staged --redact --no-banner",
]

[tasks."site:build"]
description = "Build the static showcase site into website/dist"
run = "go run ./tools/sitegen"

[tasks."site:serve"]
description = "Build the showcase site and serve it at http://localhost:4173"
run = "go run ./tools/sitegen -serve"

[tasks."site:screenshots"]
description = "Capture showcase screenshots from the running GUI into website/screenshots"
depends = ["build:backend"]
run = "bash website/capture-screenshots.sh"

[tasks."release:snapshot"]
description = "Build a local snapshot release for the current operating system"
run = "RELEASE_TARGET=\"$(go env GOOS)/$(go env GOARCH)\" goreleaser release --snapshot --clean"

[tasks."release:package"]
description = "Build and package release archives for RELEASE_TARGET (one platform)"
run = "goreleaser release --clean --skip=publish --skip=validate"

[tasks."release:cut"]
description = "Cut a release: bump or set the version, commit, tag and push with tags"
usage = 'arg "<bump>" help="major, minor, patch, or an explicit X.Y.Z version" default="patch"'
run = "bash scripts/cut-release.sh \"${usage_bump:-patch}\""

[tasks.clean]
description = "Clean up build outputs"
run = "rm -rf bin/ dist/ frontend/dist website/dist"
