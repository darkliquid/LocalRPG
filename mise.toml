[tools]
go = "1.27.1"

[tasks.setup]
description = "Install Go dependencies"
run = "go mod download"

[tasks."build:backend"]
description = "Build the localrpg binary"
run = "go build -o bin/localrpg ./cmd/localrpg"
sources = ["cmd/**/*", "pkg/**/*", "go.mod"]
outputs = ["bin/localrpg"]

[tasks.build]
description = "Build the localrpg binary"
depends = ["build:backend"]

[tasks."test:backend"]
description = "Run all Go unit and integration tests"
run = "go test -v -count=1 ./..."

[tasks.test]
description = "Run all tests"
depends = ["test:backend"]

[tasks.lint]
description = "Run code analysis and linting"
run = "go vet ./..."

[tasks."dev:gui"]
description = "Launch the desktop GUI"
run = "go run ./cmd/localrpg"

[tasks."desktop:snapshots"]
description = "Regenerate desktop golden snapshots"
run = "UPDATE_SNAPSHOTS=1 go test ./pkg/desktop/... -run Snapshot -count=1"

[tasks."desktop:build"]
description = "Cross-compile the GUI for Linux, Windows, and macOS (CGO-free)"
run = """
mkdir -p bin
CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o bin/localrpg-linux-amd64     ./cmd/localrpg
CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o bin/localrpg-linux-arm64     ./cmd/localrpg
CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o bin/localrpg-windows-amd64.exe ./cmd/localrpg
CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o bin/localrpg-darwin-amd64    ./cmd/localrpg
CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o bin/localrpg-darwin-arm64    ./cmd/localrpg
"""
sources = ["cmd/**/*", "pkg/**/*", "go.mod"]

[tasks."desktop:png"]
description = "Render one GUI frame to a PNG and exit"
run = "go run ./cmd/localrpg --png /tmp/localrpg-frame.png"

[tasks.clean]
description = "Clean up build outputs"
run = "rm -rf bin/"
