<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer ambient aura -->
    <radialGradient id="d20-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>

    <!-- Center 20 Face (Radiant Lavender-Purple) -->
    <linearGradient id="d20-face-center" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Top Left Facet -->
    <linearGradient id="d20-top-left" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Top Right Facet -->
    <linearGradient id="d20-top-right" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Mid Left Facet -->
    <linearGradient id="d20-mid-left" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Mid Right Facet -->
    <linearGradient id="d20-mid-right" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Outer Flank Left -->
    <linearGradient id="d20-outer-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Outer Flank Right -->
    <linearGradient id="d20-outer-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Bottom Left Facet -->
    <linearGradient id="d20-bot-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Bottom Right Facet -->
    <linearGradient id="d20-bot-right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Bottom Center Facet -->
    <linearGradient id="d20-bot-center" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <filter id="d20-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="50" cy="50" r="47" fill="url(#d20-aura)"/>

  <!-- D20 Facets -->
  <g stroke="#e9d5ff" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top 2 Facets -->
    <polygon points="50,22.8 11.9,28 50,6" fill="url(#d20-top-left)"/>
    <polygon points="50,22.8 50,6 88.1,28" fill="url(#d20-top-right)"/>

    <!-- Upper Lateral Facets -->
    <polygon points="50,22.8 26.4,63.6 11.9,28" fill="url(#d20-mid-left)"/>
    <polygon points="50,22.8 88.1,28 73.6,63.6" fill="url(#d20-mid-right)"/>

    <!-- Outer Flank Facets -->
    <polygon points="26.4,63.6 11.9,72 11.9,28" fill="url(#d20-outer-left)"/>
    <polygon points="73.6,63.6 88.1,28 88.1,72" fill="url(#d20-outer-right)"/>

    <!-- Bottom Lateral Facets -->
    <polygon points="26.4,63.6 50,94 11.9,72" fill="url(#d20-bot-left)"/>
    <polygon points="73.6,63.6 88.1,72 50,94" fill="url(#d20-bot-right)"/>

    <!-- Bottom Center Underneath Face -->
    <polygon points="26.4,63.6 73.6,63.6 50,94" fill="url(#d20-bot-center)"/>

    <!-- Center '20' Face -->
    <polygon points="50,22.8 73.6,63.6 26.4,63.6" fill="url(#d20-face-center)" stroke="#ffffff" stroke-width="1.8" filter="url(#d20-glow)"/>
  </g>

  <!-- Vector 'LR' Monogram with Crisp Edge & Subtle Shadow -->
  <path d="M 39.92 56.42 L 39.92 55.62 L 41.18 55.62 L 41.18 47.38 L 39.92 47.38 L 39.92 46.58 L 44.98 46.58 L 44.98 47.38 L 43.72 47.38 L 43.72 55.52 L 47.60 55.52 L 47.60 53.96 L 48.48 53.96 L 48.48 56.42 L 39.92 56.42 Z M 55.95 51.62 Q 56.53 51.70 56.93 52.00 Q 57.34 52.31 57.63 52.88 L 59.07 55.62 L 60.08 55.62 L 60.08 56.42 L 56.84 56.42 L 55.27 53.45 Q 54.82 52.53 54.50 52.27 Q 54.18 52.02 53.61 52.02 L 53.21 52.02 L 53.21 55.62 L 54.48 55.62 L 54.48 56.42 L 49.41 56.42 L 49.41 55.62 L 50.67 55.62 L 50.67 47.38 L 49.41 47.38 L 49.41 46.58 L 55.03 46.58 Q 56.74 46.58 57.68 47.27 Q 58.61 47.96 58.61 49.22 Q 58.61 50.25 57.95 50.85 Q 57.28 51.45 55.95 51.62 Z M 53.21 51.23 L 54.07 51.23 Q 55.00 51.23 55.49 50.73 Q 55.99 50.22 55.99 49.30 Q 55.99 48.37 55.49 47.87 Q 55.00 47.38 54.07 47.38 L 53.21 47.38 L 53.21 51.23 Z" fill="#2e1065" opacity="0.4" transform="translate(0, 0.9)"/>
  <path d="M 39.92 56.42 L 39.92 55.62 L 41.18 55.62 L 41.18 47.38 L 39.92 47.38 L 39.92 46.58 L 44.98 46.58 L 44.98 47.38 L 43.72 47.38 L 43.72 55.52 L 47.60 55.52 L 47.60 53.96 L 48.48 53.96 L 48.48 56.42 L 39.92 56.42 Z M 55.95 51.62 Q 56.53 51.70 56.93 52.00 Q 57.34 52.31 57.63 52.88 L 59.07 55.62 L 60.08 55.62 L 60.08 56.42 L 56.84 56.42 L 55.27 53.45 Q 54.82 52.53 54.50 52.27 Q 54.18 52.02 53.61 52.02 L 53.21 52.02 L 53.21 55.62 L 54.48 55.62 L 54.48 56.42 L 49.41 56.42 L 49.41 55.62 L 50.67 55.62 L 50.67 47.38 L 49.41 47.38 L 49.41 46.58 L 55.03 46.58 Q 56.74 46.58 57.68 47.27 Q 58.61 47.96 58.61 49.22 Q 58.61 50.25 57.95 50.85 Q 57.28 51.45 55.95 51.62 Z M 53.21 51.23 L 54.07 51.23 Q 55.00 51.23 55.49 50.73 Q 55.99 50.22 55.99 49.30 Q 55.99 48.37 55.49 47.87 Q 55.00 47.38 54.07 47.38 L 53.21 47.38 L 53.21 51.23 Z" fill="#ffffff"/>
</svg>