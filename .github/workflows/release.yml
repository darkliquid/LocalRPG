name: Release

# Tag a commit that already passed CI, e.g. `git tag v0.2.0 && git push origin v0.2.0`,
# or cut a release via GitHub.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A tag is a promise that the commit is good, so re-run the checks here rather
  # than trusting that whoever tagged it waited for CI.
  verify:
    name: Verify
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v')
    uses: ./.github/workflows/ci.yml

  frontend:
    name: Build embedded frontend
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: jdx/mise-action@v5

      - name: Cache the npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # The GUI embeds pkg/gui/dist, so the bundle has to exist in the tree
      # goreleaser compiles. It is platform independent, so build it once and
      # hand it to every packaging runner.
      - name: Build the frontend bundle
        run: mise run build:frontend

      - name: Upload the frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: gui-dist
          path: pkg/gui/dist
          retention-days: 1

  package:
    name: Package ${{ matrix.target }}
    needs: [verify, frontend]
    runs-on: ${{ matrix.runner }}
    # Keep the Go caches inside the workspace so one path works on every target;
    # the default build cache lives in a different directory on each OS.
    env:
      GOMODCACHE: ${{ github.workspace }}/.go/mod
      GOCACHE: ${{ github.workspace }}/.go/build
    strategy:
      fail-fast: false
      matrix:
        # One native runner per target. Linux arm64 gets its own arm64 runner
        # because a CGO build for arm64 cannot be produced from an amd64 host;
        # the Apple Silicon runner cross-compiles the Intel slice, which clang
        # and the universal macOS SDK handle natively.
        include:
          - runner: ubuntu-latest
            target: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
          - runner: macos-latest
            target: darwin/arm64
            artifact: darwin-arm64
          - runner: macos-latest
            target: darwin/amd64
            artifact: darwin-amd64
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the tag and the commits it points at.
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        id: mise

      # Linux links GTK/WebKit/ALSA at build time; the action caches the
      # packages so only a cold cache pays for the fetch. The other targets
      # need no native headers.
      - name: Install native build dependencies
        if: startsWith(matrix.target, 'linux')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libasound2-dev libx11-dev
          version: 1.0

      # The caches are keyed on the lockfile (and, for the build cache, the
      # commit) so a module change or a new revision restores the right one.
      - name: Cache the Go module cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.go/mod
          key: go-mod-${{ runner.os }}-${{ steps.mise.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ steps.mise.outputs.go }}-
            go-mod-${{ runner.os }}-

      - name: Cache the Go build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.go/build
          key: go-build-${{ runner.os }}-${{ steps.mise.outputs.go }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.mise.outputs.go }}-
            go-build-${{ runner.os }}-

      - name: Restore the embedded frontend
        uses: actions/download-artifact@v8
        with:
          name: gui-dist
          path: pkg/gui/dist

      # RELEASE_TARGET selects the one build in .goreleaser.yaml this runner
      # can link; every other build skips itself. Publishing is deferred to the
      # `publish` job because GoReleaser's split/merge is a Pro feature.
      - name: Build and package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:package

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          # Artifact names cannot contain a slash, and the expression language
          # has no replace(), so each matrix entry carries its own name.
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Collect archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      # Each runner wrote checksums for its own archives only, so replace them
      # with one file covering the whole release.
      - name: Write the checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      # Publish a new release or enrich an existing release (e.g. if cut via the
      # GitHub UI or pre-created as a draft).
      - name: Publish or enrich the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          TAG="${TAG_NAME}"
          echo "Publishing release artifacts for tag: ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub. Enriching release..."

            # Populate title if empty or defaulted to the tag name
            existing_title="$(gh release view "$TAG" --json name --jq .name)"
            if [ -z "$existing_title" ] || [ "$existing_title" = "null" ] || [ "$existing_title" = "$TAG" ]; then
              echo "Updating release title to 'LocalRPG ${TAG}'..."
              gh release edit "$TAG" --title "LocalRPG ${TAG}"
            fi

            # Populate release notes if body is empty
            existing_body="$(gh release view "$TAG" --json body --jq .body)"
            if [ -z "$existing_body" ] || [ "$existing_body" = "null" ]; then
              echo "Generating release notes..."
              gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$TAG" --jq .body > /tmp/release-notes.md 2>/dev/null || true
              if [ -s /tmp/release-notes.md ]; then
                gh release edit "$TAG" --notes-file /tmp/release-notes.md
              fi
            fi

            # Mark as prerelease if the tag indicates a pre-release version
            case "$TAG" in
              *-*)
                existing_prerelease="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
                if [ "$existing_prerelease" != "true" ]; then
                  echo "Marking ${TAG} as prerelease..."
                  gh release edit "$TAG" --prerelease
                fi
                ;;
            esac

            echo "Uploading release assets..."
            gh release upload "$TAG" release/* --clobber
          else
            echo "Release ${TAG} does not exist. Creating release..."
            args=(--title "LocalRPG ${TAG}" --generate-notes)
            case "$TAG" in
              *-*) args+=(--prerelease) ;;
            esac
            gh release create "$TAG" release/* "${args[@]}"
          fi
