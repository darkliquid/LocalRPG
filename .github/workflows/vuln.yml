name: Vulnerabilities

# Scans Go module dependencies for known vulnerabilities.
# Runs on every push to main, on every pull request, and weekly so newly
# published vulnerabilities in dependencies are caught even if code hasn't changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Scan Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        id: mise

      - name: Cache the Go module cache
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ steps.mise.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ steps.mise.outputs.go }}-
            go-mod-${{ runner.os }}-

      - name: Scan dependencies for vulnerabilities
        run: mise run vuln:scan
