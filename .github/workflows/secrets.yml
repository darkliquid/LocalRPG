name: Secrets

# Anything that reaches a commit is published the moment it is pushed, so this
# runs on every change and then weekly: new detection rules are published all
# the time, and they need to be applied to history that has not moved.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history must be present. A secret deleted in a later
          # commit is still readable by anyone who clones the repository.
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      # Extends the default ruleset; see .gitleaks.toml. The staged scan is a
      # no-op here but is what makes the same task useful before a local commit.
      - name: Scan the full history and staged changes
        run: mise run secrets:scan
