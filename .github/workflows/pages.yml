name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are serialised: a newer build should wait for the one in
# flight rather than cancel it, so the live site is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # Reads README.md and pkg/gui/docs/*.md, renders them through
      # tools/sitegen, and copies website/screenshots into the output.
      - name: Build the showcase site
        run: mise run site:build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          # The generator writes .nojekyll so Pages serves the assets verbatim.
          include-hidden-files: true

  deploy:
    name: Deploy the site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
