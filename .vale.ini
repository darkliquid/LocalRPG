StylesPath = styles

MinAlertLevel = suggestion

Packages = Google, write-good, proselint, Readability, neighbor, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Vale checks the user-facing documentation only: the guide the application
# embeds and the two reference pages the showcase site renders. Everything else in
# the repository is internal - design specs, plans, agent notes, generated content -
# and is not linted. `scripts/lint-prose.sh` decides which files reach Vale; the
# three sources are the same ones tools/sitegen/content.go renders.
[*.md]
BasedOnStyles = Vale, Google, write-good, proselint, Readability, neighbor, ai-tells

# Vocabulary for the words Vale's dictionary does not know. Committed, and lives
# under the StylesPath so Vale finds it without further configuration.
Vocab = LocalRPG

# A vocabulary also produces a Terms rule that demands one capitalisation per
# word, and here that rule is wrong more often than right. It fires on table data
# (the provider catalogue lists `http` and `gemini` as source types, lowercase by
# design), on YAML frontmatter values and titles (`Frontmatter` in a `title:` and
# in an H1), and on bolded list labels (`**Config (...)**`). All of those are
# correct as written. The vocabulary is used for spelling only, and both cases of
# the words that legitimately appear in both are listed.
Vale.LocalRPG.Terms = NO

# ---------------------------------------------------------------------------
# Rules switched off because technical documentation cannot satisfy them without
# becoming worse. Each of these fires on correct, deliberate writing.
# ---------------------------------------------------------------------------

# Word length and grade-level scores. These measure how complex the words and
# sentences are, which for a guide about local language models and audio pipelines
# is inherent rather than a fault. Satisfying them means writing around the
# vocabulary a reader came here to learn.
Readability.Polysyllables = NO
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO
Readability.ColemanLiau = NO
Readability.SMOG = NO
Readability.LIX = NO
Readability.GunningFog = NO
Readability.AutomatedReadability = NO

# A capitalised word after a colon. This documentation is built on definition
# lists and labelled steps - "Route: the path the request takes" - so the rule
# objects to the format rather than to a mistake. ai-tells.ColonUsage and
# Google.Colons are the same check from two styles.
Google.Colons = NO
ai-tells.ColonUsage = NO

# Spelling out every acronym at first use. The guide is about TTS, STT, LLM, MCP
# and CLI, and the vocabulary file is what tells Vale they are words. The rule
# still fires on second and later uses.
Google.Acronyms = NO

# Parentheses. They carry asides and unit conversions in technical prose, and the
# rule's advice to use them judiciously is not something a linter can judge.
Google.Parens = NO

# Banning the verb "to be". E-Prime is a deliberate constraint for some writing,
# not a general rule, and it is impossible to follow in technical English.
write-good.E-Prime = NO

# Acronyms written in capitals, which screen readers may spell out. The acronyms
# are correct; renaming them would break every cross-reference to the rest of the
# documentation.
neighbor.AllCapsProse = NO

# Title Case headings. This documentation uses Title Case throughout and the
# showcase site's design is built around it, so the rule would mean re-casing
# every heading in every article. This is the one suppression that is a house
# style rather than a property of technical writing; switch it back on if the
# headings are ever re-cased.
Google.Headings = NO

# ---------------------------------------------------------------------------
# ai-tells rules whose premise does not survive contact with reference
# documentation. The rest of that style is on and its findings are fixed rather
# than muted.
# ---------------------------------------------------------------------------

# Three-item lists. The rule looks for a rhetorical tricolon, but it matches any
# list of three, which is ordinary English and everywhere in this guide. It fired
# on "system identity, action modes, and metadata" and on "ComfyUI,
# Automatic1111, LocalAI" - three servers, not a figure of speech.
ai-tells.VerbTricolon = NO

# Semicolons joining two related clauses. The punctuation is correct, and this
# repository's own convention prefers semicolons to em dashes.
ai-tells.SemicolonUsage = NO

# En dashes in number ranges. The rule reports "em-dash detected" for U+2013, and
# 15 of its 16 findings here are ranges such as "4-6 GB" and "16-24 GB", where an
# en dash is the correct character. It is looking for em dashes.
ai-tells.EmDashUsage = NO

# GitHub alert blocks. The rule sees "[!NOTE]" and reports a note left in the
# text, but this is live syntax: remark-github-blockquote-alert renders it as a
# callout in the app and on the site.
proselint.Annotations = NO
