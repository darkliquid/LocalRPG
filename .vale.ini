StylesPath = styles

MinAlertLevel = suggestion

Packages = Google, write-good, proselint, Readability, neighbor, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Vale checks the user-facing documentation only: the guide the application
# embeds and the two reference pages the showcase site renders. Everything else in
# the repository is internal - design specs, plans, agent notes, generated content -
# and is not linted. `scripts/lint-prose.sh` decides which files reach Vale; the
# three sources are the same ones tools/sitegen/content.go renders.
[*.md]
BasedOnStyles = Vale, Google, write-good, proselint, Readability, neighbor

